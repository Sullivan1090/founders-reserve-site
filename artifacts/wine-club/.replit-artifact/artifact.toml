kind = "web"
previewPath = "/"
title = "Wine Club"
version = "1.0.0"
id = "artifacts/wine-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21207

[services.development]
run = "pnpm --filter @workspace/wine-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wine-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/wine-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21207"
BASE_PATH = "/"
